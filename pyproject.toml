[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "agathos-bot"
version = "0.2.2"
description = "Discord bot for tabletop game tools"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "workers-runtime-sdk",
]

[project.optional-dependencies]
clue = [
    "rapidfuzz>=3.14.5",
]

[dependency-groups]
dev = [
    "workers-py",
    "ruff>=0.15.19",
    "ty>=0.0.53",
]

[tool.setuptools]
include-package-data = false
py-modules = ["evaluator_worker"]

[tool.setuptools.packages.find]
include = ["agathos", "agathos.*", "language", "language.*"]

[tool.ruff.format]
indent-style = "tab"
